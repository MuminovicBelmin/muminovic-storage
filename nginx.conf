# Include this file from the host nginx http {} block after the Let's Encrypt
# certificate for storage.muminovic.devotus.eu already exists.

upstream muminovic_nextcloud_upstream {
	server 127.0.0.1:17880;
	keepalive 32;
}

server {
	listen 80;
	listen [::]:80;
	server_name storage.muminovic.devotus.eu;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
		default_type text/plain;
	}

	location = /.well-known/carddav {
		return 301 https://$host/remote.php/dav;
	}

	location = /.well-known/caldav {
		return 301 https://$host/remote.php/dav;
	}

	location ^~ /.well-known {
		return 301 https://$host/index.php$uri;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name storage.muminovic.devotus.eu;

	# These files must exist before this final TLS vhost can be loaded.
	ssl_certificate /etc/letsencrypt/live/storage.muminovic.devotus.eu/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/storage.muminovic.devotus.eu/privkey.pem;
	ssl_trusted_certificate /etc/letsencrypt/live/storage.muminovic.devotus.eu/chain.pem;

	client_max_body_size 0;
	# Keep client_body_temp_path on a host filesystem sized for worst-case concurrent uploads.
	client_body_timeout 86400s;
	send_timeout 86400s;

	proxy_request_buffering off;
	proxy_buffering off;
	proxy_max_temp_file_size 0;
	proxy_read_timeout 86400s;
	proxy_send_timeout 86400s;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options SAMEORIGIN always;
	add_header Referrer-Policy no-referrer always;
	add_header X-Accel-Buffering no always;

	location = /.well-known/carddav {
		return 301 https://$host/remote.php/dav;
	}

	location = /.well-known/caldav {
		return 301 https://$host/remote.php/dav;
	}

	location ^~ /.well-known {
		return 301 https://$host/index.php$uri;
	}

	location / {
		proxy_pass http://muminovic_nextcloud_upstream;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Port 443;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-Ssl on;
	}
}