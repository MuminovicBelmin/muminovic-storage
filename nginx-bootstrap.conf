# Include this file from the host nginx http {} block before the first
# Let's Encrypt certificate is issued for storage.muminovic.devotus.eu.
#
# Purpose:
# - allow HTTP-01 ACME validation on port 80
# - avoid loading TLS certificate paths that do not exist yet

server {
	listen 80;
	listen [::]:80;
	server_name storage.muminovic.devotus.eu;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
		default_type text/plain;
	}

	location / {
		return 404;
	}
}