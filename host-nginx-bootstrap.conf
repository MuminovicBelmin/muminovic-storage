user	   www-data;  ## Default: nobody
worker_processes  4;  ## Default: 1

worker_rlimit_nofile 8192;

events {
	worker_connections  4096;  ## Default: 1024
}

http {
	include mime.types;
	server {
		listen 80;
		server_name demoncalendar.online www.demoncalendar.online;

		# Redirect all HTTP requests to HTTPS
		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		server_name demoncalendar.online www.demoncalendar.online;

		# SSL Certificate Configuration
		ssl_certificate /home/DemonCalendar_Website/ssl/demoncalendar.online_ssl_certificate.cer;
		ssl_certificate_key /home/DemonCalendar_Website/ssl/demoncalendar.online_private_key.key;

		# Static Files Configuration
		root /home/DemonCalendar_Website/build;
		index index.html;

		# Additional Security Headers
		add_header X-Content-Type-Options nosniff;
		add_header X-Frame-Options DENY;
		add_header X-XSS-Protection "1; mode=block";
		add_header Strict-Transport-Security "max-age=15552000; includeSubDomains";

		# Cache Control for Static Files
		location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
			expires 7d;
			add_header Cache-Control "public, max-age=604800";
		}

		# React App Routing
		location / {
			try_files $uri $uri/ =404;
		}

		# Enable Gzip Compression
		gzip on;
		gzip_comp_level 5;
		gzip_min_length 256;
		gzip_proxied any;
		gzip_types application/javascript application/json text/css text/javascript text/plain text/xml;
	}

	server {
		listen 80;
		server_name storage.demoncalendar.online;

		# Redirect all HTTP requests to HTTPS
		return 301 https://$host$request_uri;
	}

	server {
		client_max_body_size 4096G;
		client_body_timeout 86400s;
		send_timeout 86400s;
		proxy_request_buffering off;
		proxy_buffering off;
		proxy_read_timeout 86400s;
		proxy_send_timeout 86400s;

		listen 443 ssl;
		server_name storage.demoncalendar.online;

		# SSL Certificate Configuration
		ssl_certificate /home/DemonCalendar_Website/ssl/demoncalendar.online_ssl_certificate.cer;
		ssl_certificate_key /home/DemonCalendar_Website/ssl/demoncalendar.online_private_key.key;

		add_header Strict-Transport-Security "max-age=15552000; includeSubDomains";
		
		location / {
			proxy_pass http://localhost:7777;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $host;
			proxy_set_header X-Forwarded-Port 443;
			proxy_set_header X-Forwarded-Ssl on;
		}

		location /.well-known/carddav {
			return 301 $scheme://$host/remote.php/dav;
		}

		location /.well-known/caldav {
			 return 301 $scheme://$host/remote.php/dav;
		}

		location ^~ /.well-known {
			return 301 $scheme://$host/index.php$uri;
		}
	}

	server {
		listen 80;
		listen [::]:80;
		server_name storage.muminovic.devotus.eu;

		location ^~ /.well-known/acme-challenge/ {
			root /var/www/certbot;
			default_type text/plain;
		}

		location / {
			return 404;
		}
	}
}